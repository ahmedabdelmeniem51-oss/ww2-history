<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAR STORE - نسخة تجريبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Reem+Kufi:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-main: #0A1628;
            --bg-secondary: #1A2B4A;
            --bg-card: #1A2B4A;
            --accent: #E63946;
            --accent-hover: #c42d38;
            --green: #06D6A0;
            --gold: #FFB800;
            --text: #FFFFFF;
            --text-secondary: #A0ABBF;
            --border: rgba(255,255,255,0.08);
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-main);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* ========== Navbar ========== */
        .navbar {
            background: var(--bg-main);
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
        }
        
        .logo-text h1 {
            font-size: 1.3rem;
            font-family: 'Reem Kufi', sans-serif;
            font-weight: 900;
            line-height: 1;
        }
        
        .logo-text span {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }
        
        .nav-links a {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 700;
            padding: 8px 0;
            cursor: pointer;
            transition: color 0.3s;
            position: relative;
        }
        
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }
        
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }
        
        /* ========== Pages ========== */
        .page { display: none; }
        .page.active { display: block; }
        
        /* ========== Hero Slider ========== */
        .hero-section {
            padding: 40px 0;
        }
        
        .hero-slider {
            position: relative;
            width: 100%;
            aspect-ratio: 16/5;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        
        .hero-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
            cursor: pointer;
        }
        
        .hero-slide.active {
            opacity: 1;
            z-index: 2;
        }
        
        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .hero-slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                transparent 40%,
                rgba(10, 22, 40, 0.85) 70%,
                rgba(10, 22, 40, 0.95) 100%
            );
            z-index: 1;
        }
        
        .hero-content {
            position: absolute;
            top: 50%;
            right: 60px;
            transform: translateY(-50%);
            z-index: 3;
            text-align: right;
            max-width: 450px;
        }
        
        .hero-badge {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        .hero-content h2 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        
        .hero-content .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 20px;
        }
        
        .btn-hero {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 14px 36px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            border: none;
            font-family: inherit;
            cursor: pointer;
        }
        
        .btn-hero:hover {
            background: var(--accent-hover);
            transform: translateY(-3px);
        }
        
        /* Slider Dots */
        .slider-dots {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .dot {
            width: 40px;
            height: 5px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .dot.active {
            background: var(--accent);
            width: 60px;
        }
        
        /* ========== Section ========== */
        .section {
            padding: 50px 0;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .section-header h2 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
        }
        
        /* ========== Games Grid ========== */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }
        
        .game-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .game-card:hover {
            transform: translateY(-8px);
        }
        
        .game-image {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-secondary);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            margin-bottom: 12px;
        }
        
        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }
        
        .game-card:hover .game-image img {
            transform: scale(1.08);
        }
        
        .game-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            z-index: 2;
        }
        
        .badge-pre { background: var(--accent); }
        .badge-new { background: var(--green); color: #000; }
        .badge-hot { background: var(--gold); color: #000; }
        
        .game-info h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
            line-height: 1.3;
            min-height: 40px;
        }
        
        .game-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--green);
        }
        
        /* ========== Game Detail ========== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .back-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .game-hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16/5;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }
        
        .game-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .game-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                transparent 40%,
                rgba(10, 22, 40, 0.85) 75%,
                rgba(10, 22, 40, 0.98) 100%
            );
            z-index: 1;
        }
        
        .game-hero-content {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 40px;
            z-index: 2;
            display: flex;
            gap: 30px;
            align-items: flex-end;
        }
        
        .game-cover-box {
            width: 180px;
            flex-shrink: 0;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 3px solid rgba(255,255,255,0.1);
            transform: translateY(-10px);
        }
        
        .game-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .game-hero-info {
            flex: 1;
            padding-bottom: 10px;
        }
        
        .game-hero-info h1 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        
        .game-meta {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .meta-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .meta-value {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        
        /* ========== Detail Grid ========== */
        .detail-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }
        
        .detail-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        
        .detail-section h2 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .detail-section h2 i {
            color: var(--accent);
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        
        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Variants */
        .platform-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .variants-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .variant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--bg-main);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .variant-item:hover {
            border-color: var(--accent);
            background: rgba(230,57,70,0.05);
            transform: translateX(-5px);
        }
        
        .variant-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .variant-title {
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        
        .variant-region {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .variant-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--green);
            font-family: 'Reem Kufi', sans-serif;
        }
        
        .btn-whatsapp {
            width: 100%;
            padding: 18px;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 20px;
            text-decoration: none;
        }
        
        .btn-whatsapp:hover {
            background: #1ea952;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37,211,102,0.4);
        }
        
        /* Responsive */
        @media (max-width: 968px) {
            .nav-links { display: none; }
            .hero-content { right: 30px; max-width: 350px; }
            .hero-content h2 { font-size: 2rem; }
            .detail-grid { grid-template-columns: 1fr; }
            .game-hero-content { padding: 25px; gap: 20px; }
            .game-cover-box { width: 140px; }
            .game-hero-info h1 { font-size: 1.8rem; }
        }
        
        @media (max-width: 600px) {
            .hero-content { right: 20px; left: 20px; max-width: none; }
            .hero-content h2 { font-size: 1.5rem; }
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .game-hero-content { flex-direction: column; align-items: flex-start; padding: 20px; }
            .game-cover-box { width: 100px; }
            .game-hero-info h1 { font-size: 1.4rem; }
            .game-meta { gap: 20px; }
        }
    </style>
</head>

    <!-- ========== PAGE: Home ========== -->

    <!-- ========== PAGE: Game Detail ========== -->
    <div id="page-game" class="page">
        <section class="section">
            <div class="container">
                <button class="back-btn" onclick="showPage('home')">
                    <i class="fas fa-arrow-right"></i> رجوع
                </button>
                <div id="gameDetailContent"></div>
            </div>

    </div>

    <script>
        // ============================================
        // إعدادات
        // ============================================
        const WHATSAPP_NUMBER = '201234567890'; // ✏️ غيّر الرقم

        // ============================================
        // بيانات الألعاب
        // ============================================
        const gamesData = [
            {
                id: 'ea-fc-27',
                title: 'EA Sports FC 27',
                category: 'new',
                badge: 'جديد',
                badgeType: 'badge-new',
                cover: 'https://cdn.phototourl.com/member/2026-09-15-66220152-a2d9-454b-8d9a-0b619313fb08.png',
                hero: 'https://i.ibb.co/wZyhDYzZ/Gemini-Generated-Image-l65p4nl65p4nlp65p.jpg',
                video: 'https://youtu.be/SAGT2U-PGgM?si=IeaWJislxgG4iLfO',
                space: '63.5 GB',
                platforms: 'PlayStation / PC / Xbox',
                genres: 'Open World / Sports / Simulation',
                variants: [
                    { platform: 'PS4', title: 'Primary', price: 900 },
                    { platform: 'PS4', title: 'Primary Ultimate', price: 1000 },
                    { platform: 'PS4', title: 'Secondary Ultimate', price: 2250 },
                    { platform: 'PS5', title: 'Primary', price: 2100 },
                    { platform: 'PS5', title: 'Secondary', price: 1200 },
                    { platform: 'PS5', title: 'Primary Ultimate', price: 2500 },
                    { platform: 'PS5', title: 'Secondary Ultimate', price: 2250 }
                ]
            },
            {
                id: 'gta-6',
                title: 'Grand Theft Auto VI',
                category: 'pre',
                badge: 'Pre-Order',
                badgeType: 'badge-pre',
                cover: 'https://cdn.phototourl.com/member/2026-09-15-f33575c1-4959-4f74-aa90-a7c2bef19976.png',
                hero: 'https://cdn.phototourl.com/member/2026-09-15-8149bbb7-99e7-4f5d-9682-1f075a881a85.png',
                video: 'https://youtu.be/tJbzMqJGH4k?si=yTeq3P8J5AJXzKC9',
                space: '280 GB',
                platforms: 'PlayStation 5',
                genres: 'Open World / Action / Racing',
                variants: [
                    { platform: 'PS5', title: 'Primary', price: 2400 },
                    { platform: 'PS5', title: 'Secondary', price: 1800 },
                    { platform: 'PS5', title: 'Primary Ultimate', price: 3400 },
                    { platform: 'PS5', title: 'Secondary Ultimate', price: 2100 },
                    { platform: 'PS5', title: 'Full Ultimate', price: 5050 },
                    { platform: 'PS5', title: 'Full Standard', price: 3950 }
                ]
            },
            {
                id: 'aot-3',
                title: 'Attack on Titan 3',
                category: 'pre',
                badge: 'Pre-Order',
                badgeType: 'badge-pre',
                cover: 'https://cdn.phototourl.com/member/2026-09-15-672ae383-00e8-4032-b4a8-a41e02a37f1c.png',
                hero: 'https://cdn.phototourl.com/member/2026-09-15-36fdc540-618f-422e-8a10-8149571a4746.png',
                video: 'https://youtu.be/GdYvajGiPnY?si=ewuxDX5zj1aS8isZ',
                space: '80 GB',
                platforms: 'PlayStation 5',
                genres: 'Action / Hack & Slash',
                variants: [
                    { platform: 'PS5', title: 'Primary', price: 2000 },
                    { platform: 'PS5', title: 'Secondary', price: 1400 }
                ]
            }
        ];

        // ============================================
        // تحويل لينك YouTube لـ Embed
        // ============================================
        function getEmbedUrl(url) {
            if (!url) return '';
            let videoId = '';
            
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('youtube.com/watch')) {
                videoId = new URL(url).searchParams.get('v');
            }
            
            return videoId ? `https://www.youtube-nocookie.com/embed/${videoId}` : '';
        }

        // ============================================
        // Hero Slider
        // ============================================
        let currentSlide = 0;
        let totalSlides = 0;
        let sliderInterval;

        function renderHeroSlider() {
            const slider = document.getElementById('heroSlider');
            const heroGames = gamesData.slice(0, 3);
            totalSlides = heroGames.length;
            
            let slidesHTML = '';
            let dotsHTML = '';
            
            heroGames.forEach((game, index) => {
                const minPrice = Math.min(...game.variants.map(v => v.price));
                
                slidesHTML += `
                    <div class="hero-slide ${index === 0 ? 'active' : ''}" data-index="${index}" onclick="showGame('${game.id}')">
                        <img src="${game.hero}" alt="${game.title}">
                        <div class="hero-content">
                            <span class="hero-badge">${game.badge}</span>
                            <h2>${game.title}</h2>
                            <p class="price">يبدأ من ${minPrice.toLocaleString()} EGP</p>
                            <button class="btn-hero">اطلب الآن</button>
                        </div>
                    </div>
                `;
                
                dotsHTML += `<div class="dot ${index === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToSlide(${index})"></div>`;
            });
            
            slider.innerHTML = slidesHTML + `<div class="slider-dots">${dotsHTML}</div>`;
            
            // Auto slide
            clearInterval(sliderInterval);
            sliderInterval = setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                goToSlide(currentSlide);
            }, 5000);
        }

        function goToSlide(index) {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.dot');
            
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            
            currentSlide = index;
        }

        // ============================================
        // عرض شبكة الألعاب
        // ============================================
        function renderGamesGrid(containerId, games) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (games.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 20px;">لا توجد ألعاب</p>';
                return;
            }
            
            container.innerHTML = games.map(game => {
                const minPrice = Math.min(...game.variants.map(v => v.price));
                
                return `
                    <div class="game-card" onclick="showGame('${game.id}')">
                        <div class="game-image">
                            <img src="${game.cover}" alt="${game.title}">
                            <span class="game-badge ${game.badgeType}">${game.badge}</span>
                        </div>
                        <div class="game-info">
                            <h3>${game.title}</h3>
                            <div class="game-price">يبدأ من ${minPrice.toLocaleString()} EGP</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // عرض صفحة اللعبة
        // ============================================
        function showGame(gameId) {
            const game = gamesData.find(g => g.id === gameId);
            if (!game) return;
            
            // إخفاء كل الصفحات
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-game').classList.add('active');
            
            // تجميع النسخ حسب المنصة
            const ps4Variants = game.variants.filter(v => v.platform === 'PS4');
            const ps5Variants = game.variants.filter(v => v.platform === 'PS5');
            
            const renderVariant = (v) => `
                <div class="variant-item" onclick="orderViaWhatsApp('${game.title}', '${v.title}', ${v.price}, '${v.platform}')">
                    <div class="variant-info">
                        <span class="variant-title">${v.title}</span>
                        <span class="variant-region"><i class="fas fa-globe"></i> Global</span>
                    </div>
                    <div class="variant-price">${v.price.toLocaleString()} EGP</div>
                </div>
            `;
            
            const embedUrl = getEmbedUrl(game.video);
            
            document.getElementById('gameDetailContent').innerHTML = `
                <!-- Hero -->
                <div class="game-hero">
                    <img src="${game.hero}" alt="${game.title}">
                    <div class="game-hero-content">
                        <div class="game-cover-box">
                            <img src="${game.cover}" alt="${game.title}">
                        </div>
                        <div class="game-hero-info">
                            <h1>${game.title}</h1>
                            <div class="game-meta">
                                <div class="meta-item">
                                    <span class="meta-label">Space Usage</span>
                                    <span class="meta-value">${game.space}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Platforms</span>
                                    <span class="meta-value">${game.platforms}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Genres</span>
                                    <span class="meta-value">${game.genres}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Detail Grid -->
                <div class="detail-grid">
                    <div>
                        <!-- الفيديو -->
                        ${embedUrl ? `
                        <div class="detail-section">
                            <h2><i class="fas fa-play-circle"></i> فيديو اللعبة</h2>
                            <div class="video-wrapper">
                                <iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div>
                        <!-- اختر النسخة -->
                        <div class="detail-section">
                            <h2><i class="fas fa-shopping-cart"></i> اختر النسخة</h2>
                            
                            ${ps5Variants.length > 0 ? `
                                <div class="platform-title">
                                    <i class="fab fa-playstation"></i> PlayStation 5
                                </div>
                                <div class="variants-list">
                                    ${ps5Variants.map(renderVariant).join('')}
                                </div>
                            ` : ''}
                            
                            ${ps4Variants.length > 0 ? `
                                <div class="platform-title">
                                    <i class="fab fa-playstation"></i> PlayStation 4
                                </div>
                                <div class="variants-list">
                                    ${ps4Variants.map(renderVariant).join('')}
                                </div>
                            ` : ''}
                            
                            <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="btn-whatsapp">
                                <i class="fab fa-whatsapp"></i> اطلب الآن عبر واتساب
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================
        // طلب عبر واتساب
        // ============================================
        function orderViaWhatsApp(gameTitle, variantTitle, price, platform) {
            const message = `السلام عليكم 🌟
أريد شراء اللعبة التالية:

🎮 اللعبة: ${gameTitle}
📦 النسخة: ${variantTitle} (${platform})
💰 السعر: ${price.toLocaleString()} EGP
🌍 المنطقة: Global

من فضلك أرسل لي تفاصيل الدفع.`;
            
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // ============================================
        // التنقل بين الصفحات
        // ============================================
        function showPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageName).classList.add('active');
            
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if (pageName === 'home') document.querySelector('.nav-links a').classList.add('active');
            if (pageName === 'all-games') document.querySelectorAll('.nav-links a')[1].classList.add('active');
            
            if (pageName === 'all-games') {
                renderGamesGrid('allGamesGrid', gamesData);
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================
        // التشغيل
        // ============================================
        renderHeroSlider();
        renderGamesGrid('preGrid', gamesData.filter(g => g.category === 'pre'));
        renderGamesGrid('newGrid', gamesData.filter(g => g.category === 'new'));
    </script>
</body>
</html>
